<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            http-equiv="Cache-Control"
            content="max-age=3600, must-revalidate"
        />
        <title>搜索</title>
        <link rel="stylesheet" href="./style/basic.css" />
        <link rel="stylesheet" href="./style/search.css" />
    </head>
    <body>
        <div class="root">
            <nav class="nav">
                <div class="page-list-btn">
                    <div class="btn-inner"></div>
                    <div class="btn-inner"></div>
                    <div class="btn-inner"></div>
                </div>
                <div class="search">
                    <form>
                        <input type="search" placeholder="搜索" />
                    </form>
                </div>
            </nav>
            <nav class="mob-nav">
                <div class="mn-inner">
                    <div class="mn-top">
                        JMViewer
                    </div>
                    <a class="mn-item" href="./index.html"> 主页 </a>
                    <a class="mn-item" href="./favorite.html"> 收藏 </a>
                    <a class="mn-item" href="./history.html"> 历史 </a>
                    <a class="mn-item" href="./setting.html"> 设置 </a>
                </div>
            </nav>
            <div class="body">
                <h1 class="b-title">搜索结果</h1>
                <div class="sort">
                    <div
                        class="sort-item"
                        style="display: block"
                        data-mode="mostViews"
                    >
                        搜索模式：按观看量
                    </div>
                    <div class="sort-item" data-mode="addTime">
                        搜索模式：按时间
                    </div>
                    <div class="sort-item" data-mode="mostLikes">
                        搜索模式：按点赞量
                    </div>
                    <div class="sort-item" data-mode="day">
                        搜索模式：按日排行
                    </div>
                </div>
                <div class="search-cr">
                    <div class="loading-icon" style="display: block"></div>
                </div>
            </div>
            <div class="chapter">
                <div class="fold-btn">图集(20/209)</div>
                <div class="image-cr"></div>
            </div>
        </div>
        <script type="module" src="./src/pages/search.js"></script>
    </body>
</html>
